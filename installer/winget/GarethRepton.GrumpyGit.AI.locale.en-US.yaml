ShortDescription: EXPERIMENTAL - Grumpy, plus a diff review pass you choose the source of.
Description: >-
  EXPERIMENTAL. Everything in GrumpyGit - the interactive commit graph, hunk and
  line staging, push and pull through Git Credential Manager, and the split,
  single-column, blink and moved-block diff views - with an added review pass
  that reads a change and flags what looks risky. The review is a suggestion and
  not a verdict: it will miss real bugs and flag things that are fine, so read the
  diff yourself. Behaviour, settings, the module list and the model catalogue may
  change between releases. The git operations themselves are unchanged. On first
  run it asks who should review your diffs, with no default and "nobody" as one of
  the answers: a local model that runs in-process on your machine and sends your
  code nowhere; the GitHub Copilot CLI you have already signed in to, which sends
  the diff to GitHub; the Claude Code CLI you have already signed in to, which
  sends it to Anthropic; or nothing at all. No model weights are shipped and no
  token or password is ever handled by Grumpy. This is a separate install from
  GarethRepton.GrumpyGit and a much larger download; for the stable client with no
  AI in it, install that one instead.

