ShortDescription: EXPERIMENTAL - Grumpy, plus an offline local model that reviews the diff.
Description: >-
  EXPERIMENTAL. Everything in GrumpyGit - the interactive commit graph, hunk and
  line staging, push and pull through Git Credential Manager, and the split,
  single-column, blink and moved-block diff views - with an added local review pass
  that reads a change and flags what looks risky. The review is a suggestion and
  not a verdict: it will miss real bugs and flag things that are fine, so read the
  diff yourself. Behaviour, settings and the model catalogue may change between
  releases. The git operations themselves are unchanged. The model runs in-process
  on your machine and no weights are shipped: you pick one from a short catalogue
  and download it on a button press. Nothing about your code leaves the machine.
  This is a separate install from GarethRepton.GrumpyGit and a much larger
  download; for the stable client with no AI in it, install that one instead.

