ShortDescription: A diff-first Git client for Windows.
Description: >-
  A Git client for Windows built with .NET and Avalonia. It renders the full history
  as an interactive commit graph, stages whole files, hunks or individual lines, and
  pushes and pulls through Git Credential Manager. Its focus is reading a change:
  split, single-column, blink and moved-block views over one parsed diff, with the
  changed symbols listed above it. All git operations shell out to git.exe.

