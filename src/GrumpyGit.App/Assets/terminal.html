<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="xterm/xterm.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #13131F;
        }
        #terminal {
            height: 100%;
            width: 100%;
        }
        #error {
            color: #FF8080;
            font-family: Consolas, monospace;
            font-size: 13px;
            padding: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="terminal"></div>
    <div id="error"></div>

    <script src="xterm/xterm.js"></script>
    <script src="xterm/xterm-addon-fit.js"></script>
    <script src="xterm/xterm-addon-webgl.js"></script>
    <script>
        (function() {
            function showError(msg) {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = msg;
                try { terminalHost.onError(msg); } catch (e) {}
            }

            try {
                // Check that xterm.js loaded
                if (typeof Terminal === 'undefined') {
                    showError('Failed to load xterm.js. Bundled files may be missing.');
                    return;
                }

                var term = new Terminal({
                    theme: {
                        background: '#13131F',
                        foreground: '#D0D0E8',
                        cursor: '#A0A0F0',
                        cursorAccent: '#13131F',
                        selectionBackground: '#45455E',
                        selectionForeground: '#FFFFFF',
                        black: '#1E1E2E',
                        red: '#FF8080',
                        green: '#80FF80',
                        yellow: '#FFFF80',
                        blue: '#8A9FFF',
                        magenta: '#FF80FF',
                        cyan: '#80FFFF',
                        white: '#D0D0E8',
                        brightBlack: '#505080',
                        brightRed: '#FF9999',
                        brightGreen: '#99FF99',
                        brightYellow: '#FFFF99',
                        brightBlue: '#99AAFF',
                        brightMagenta: '#FF99FF',
                        brightCyan: '#99FFFF',
                        brightWhite: '#FFFFFF'
                    },
                    fontFamily: 'Consolas, Cascadia Code, monospace',
                    fontSize: 13,
                    cursorBlink: true,
                    allowProposedApi: true
                });

                var fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);

                term.open(document.getElementById('terminal'));

                // Try WebGL for GPU-accelerated rendering, fall back to canvas
                try {
                    var webglAddon = new WebglAddon.WebglAddon();
                    term.loadAddon(webglAddon);
                } catch (e) {
                    // Canvas renderer is fine
                }

                fitAddon.fit();

                // JS -> .NET: send keyboard input to ConPTY
                term.onData(function(data) {
                    try { terminalHost.onInput(data); } catch (e) {}
                });

                // JS -> .NET: notify ConPTY of terminal resize
                term.onResize(function(size) {
                    try { terminalHost.onResize(size.cols, size.rows); } catch (e) {}
                });

                // Handle container resize
                var resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function() { fitAddon.fit(); }, 50);
                });

                // .NET -> JS: write data from ConPTY output to the terminal
                window.writeToTerminal = function(data) {
                    term.write(data);
                };

                // .NET -> JS: trigger a re-fit (called after ConPTY starts)
                window.fitTerminal = function() {
                    fitAddon.fit();
                };

                // Signal to .NET that xterm.js is fully initialized and ready
                try { terminalHost.onReady(); } catch (e) {}
            } catch (e) {
                showError('Terminal initialization failed: ' + e.message);
            }
        })();
    </script>
</body>
</html>
